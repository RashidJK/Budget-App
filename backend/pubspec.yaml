name: budget_api
description: >-
  The Budget/Spaces product API: Google sign-in, a per-user document store with
  last-write-wins sync, and the Airtel Money proxy. Deploy on a VPS behind
  Cloudflare; the app syncs against it.
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.2
  postgres: ^3.4.0
  crypto: ^3.0.3

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
