# One command brings up the API + Postgres on the Contabo VPS:
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
#
# A dedicated project name keeps the containers/network/volume (spenda-api,
# spenda-db, spenda_pgdata) from colliding with the other projects on the box.
name: spenda
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://budget:${POSTGRES_PASSWORD}@db:5432/budget
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      AIRTEL_BASE_URL: ${AIRTEL_BASE_URL:-https://openapi.airtel.co.tz}
      AIRTEL_CLIENT_ID: ${AIRTEL_CLIENT_ID:-}
      AIRTEL_CLIENT_SECRET: ${AIRTEL_CLIENT_SECRET:-}
      AIRTEL_COUNTRY: ${AIRTEL_COUNTRY:-TZ}
      AIRTEL_CURRENCY: ${AIRTEL_CURRENCY:-TZS}
      PROXY_API_KEY: ${PROXY_API_KEY:-}
      # Focus opening Budget as a private Space (POST /auth/focus); off when blank.
      FOCUS_LINK_SECRET: ${FOCUS_LINK_SECRET:-}
      FOCUS_EMAIL_ALIASES: ${FOCUS_EMAIL_ALIASES:-}
      PORT: 8080
    ports:
      # Bind to localhost only; the box's existing reverse proxy routes
      # api.spenda.flow-hq.com to this port and terminates TLS. HOST_PORT is
      # configurable so it won't clash with the other projects' ports.
      - "127.0.0.1:${HOST_PORT:-8090}:8080"

volumes:
  pgdata:
